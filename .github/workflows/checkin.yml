name: GLaDOS 2026 Checkin
on:
  schedule:
    # 北京时间11:00 对应 UTC 03:00
    - cron: '0 3 * * *'
  workflow_dispatch:  # 允许手动点按钮测试
  # push:
  #   branches: [main]  # 注释，保存代码不会自动跑签到
  # repository_dispatch: # 删掉，不再用cronjob远程触发
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Checkin
        run: python checkin.py
        timeout-minutes: 62
      - name: Retry on Failure
        if: failure()
        run: |
          echo "First attempt failed, retrying in 60s..."
          sleep 60
          python checkin.py
        timeout-minutes: 5
